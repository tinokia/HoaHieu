<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kinh Pháp Cú</title>

<link rel="stylesheet" href="data/style.css">
<link rel="manifest" href="data/manifest.json">
<meta name="theme-color" content="#7b1e1e">
</head>

<body>

<header>

<div class="logo">

<h1>KINH PHÁP CÚ</h1>

<p>Thư viện Kinh Pháp Cú</p>

</div>
<div id="dongHo" class="dongho"></div>


</header>

<main>

<h2>

Danh sách Kinh Pháp Cú

<span id="tongKinh"></span>

</h2>

<div class="search-box">

<input
type="text"
id="search"
placeholder="🔍 Tìm kiếm bài kinh..."
onkeyup="timKiem()">

</div>

<div id="danhsach"></div>

<div id="phantrang" class="pagination"></div>

</main>

<footer>

© 2026 Thơ - Danh Ngôn - Kinh Pháp Cú - Đôi Liễn

</footer>

<script src="data/kinhphapcu.js"></script>
<script src="data/script.js"></script>

<script>

const ds=document.getElementById("danhsach");

const soBaiMoiTrang=10;

let trangHienTai=1;

let duLieu=[...kinhphapcu];

function hienThiKinh(){

let batDau=(trangHienTai-1)*soBaiMoiTrang;

let ketThuc=batDau+soBaiMoiTrang;

let dsHien=duLieu.slice(batDau,ketThuc);

let html="";

if(dsHien.length===0){

html=`
<div class="item">
<h3>Không tìm thấy bài kinh.</h3>
</div>
`;

}else{

dsHien.forEach(function(item){

html+=`

<div class="item">

<h3>${item.tieude}</h3>

<p>${item.tomtat}</p>

<button
class="button"
onclick="docBai('kinhphapcu',${item.id})">

📖 Đọc Kinh

</button>

</div>

`;

});

}

ds.innerHTML=html;

taoPhanTrang();

}

function taoPhanTrang(){

let tongTrang=Math.ceil(duLieu.length/soBaiMoiTrang);

let html="";

if(tongTrang<=1){

document.getElementById("phantrang").innerHTML="";

return;

}

html+=`
<button
class="page"
onclick="doiTrang(${trangHienTai-1})"
${trangHienTai==1?"disabled":""}>
◀
</button>
`;

for(let i=1;i<=tongTrang;i++){

html+=`
<button
class="page ${i==trangHienTai?'active':''}"
onclick="doiTrang(${i})">

${i}

</button>
`;

}

html+=`
<button
class="page"
onclick="doiTrang(${trangHienTai+1})"
${trangHienTai==tongTrang?"disabled":""}>
▶
</button>
`;

document.getElementById("phantrang").innerHTML=html;

}

function doiTrang(trang){

let tongTrang=Math.ceil(duLieu.length/soBaiMoiTrang);

if(trang<1||trang>tongTrang){

return;

}

trangHienTai=trang;

hienThiKinh();

}

function timKiem(){

const tuKhoa=document
.getElementById("search")
.value
.toLowerCase()
.trim();

duLieu=kinhphapcu.filter(function(item){

return(

item.tieude.toLowerCase().includes(tuKhoa)

||

(item.tomtat||"").toLowerCase().includes(tuKhoa)

||

(item.noidung||"").toLowerCase().includes(tuKhoa)

);

});

trangHienTai=1;

hienThiKinh();

}

hienThiKinh();

document.getElementById("tongKinh").innerHTML=
" ("+kinhphapcu.length+" bài)";

</script>
<script src="data/clock.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
